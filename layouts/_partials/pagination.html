{{ if gt .TotalPages 1 }}
	<nav aria-label="Pagination" class="pager">
		{{ if .HasPrev }}
			<a href="{{ .Prev.URL }}">newer</a>
		{{ else }}
			<span aria-hidden="true">newer</span>
		{{ end }}
		<span>{{ .PageNumber }}/{{ .TotalPages }}</span>
		{{ if .HasNext }}
			<a href="{{ .Next.URL }}">older</a>
		{{ else }}
			<span aria-hidden="true">older</span>
		{{ end }}
	</nav>
{{ end }}
