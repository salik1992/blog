<footer>
	<p>
		<span class="status-app">blog</span>
		{{ with site.Copyright }}{{ . }}{{ else }}{{ site.Title }}{{ end }}
		<span aria-hidden="true">·</span>
		{{ now.Year }}
		{{ with site.Home.OutputFormats.Get "rss" }}
			<span aria-hidden="true">·</span>
			<a href="{{ .RelPermalink }}">RSS</a>
		{{ end }}
		{{ with site.Params.social.x }}
			<span aria-hidden="true">·</span>
			<a href="https://x.com/{{ . }}" rel="me">@{{ . }}</a>
		{{ end }}
	</p>
	<p class="status-path" title="{{ .RelPermalink }}">{{ .RelPermalink }}</p>
</footer>
