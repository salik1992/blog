{{ range .GroupByDate "2006" }}
	<section class="year-group">
		<h2>{{ .Key }}</h2>
		<ul class="post-list">
			{{ range .Pages }}
				<li>
					<time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format "2006-01-02" }}</time>
					<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
				</li>
			{{ end }}
		</ul>
	</section>
{{ end }}
